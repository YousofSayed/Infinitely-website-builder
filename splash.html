<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loading...</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #020617;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      img {
        width: 140px;
        height: 140px;
        user-select: none;
        -webkit-user-drag: none;
        animation: fade 1.2s ease-in-out infinite alternate;
      }

      @keyframes fade {
        from {
          opacity: 0.6;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>

  <body>
    <img src="./public/logo.svg" />
  </body>
</html>
